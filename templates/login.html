<!-- templates/login.html -->
{% extends "base.html" %}
{% block content %}
<style>
    .login-container {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 3rem;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        max-width: 450px;
        width: 100%;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .login-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .login-header h2 {
        color: #2c3e50;
        font-weight: 600;
        margin-bottom: 0.5rem;
        font-size: 2rem;
    }

    .login-header p {
        color: #7f8c8d;
        font-size: 0.95rem;
    }

    .form-label {
        color: #34495e;
        font-weight: 500;
        margin-bottom: 0.5rem;
    }

    .form-control {
        padding: 0.75rem 1rem;
        border: 2px solid #e1e8ed;
        border-radius: 10px;
        transition: all 0.3s ease;
        font-size: 0.95rem;
    }

    .form-control:focus {
        border-color: #3498db;
        box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.15);
        background-color: #f8f9fa;
    }

    .btn-login {
        padding: 0.75rem 1.5rem;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1rem;
        background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        border: none;
        transition: all 0.3s ease;
        margin-top: 1rem;
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
        background: linear-gradient(135deg, #2980b9 0%, #2472a4 100%);
    }

    .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1.2rem;
        border-radius: 10px;
        font-weight: 500;
        background: rgba(255, 255, 255, 0.9);
        color: #2c3e50;
        border: 2px solid rgba(255, 255, 255, 0.3);
        transition: all 0.3s ease;
        text-decoration: none;
        margin-bottom: 2rem;
    }

    .btn-back:hover {
        background: rgba(255, 255, 255, 1);
        transform: translateX(-5px);
        color: #3498db;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.2);
    }

    .alert-danger {
        border-radius: 10px;
        border: none;
        background-color: #fee;
        color: #c33;
        padding: 1rem;
        margin-bottom: 1.5rem;
        border-left: 4px solid #e74c3c;
    }

    .input-icon {
        position: relative;
    }

    .input-icon i {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #7f8c8d;
    }
</style>

<div class="login-container">
    <div style="width: 100%; max-width: 500px;">
        <a href="{{ url_for('vista_cliente') }}" class="btn-back">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z" />
            </svg>
            Regresar al inicio
        </a>

        <div class="login-card">
            <div class="login-header">
                <h2>Iniciar sesión</h2>
                <p>Ingresa tus credenciales para continuar</p>
            </div>

            <form method="post">
                {% if error %}
                <div class="alert alert-danger">
                    <strong>Error:</strong> {{ error }}
                </div>
                {% endif %}

                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text" placeholder="Ingrese su usuario" class="form-control" id="usuario" name="usuario"
                        required autocomplete="username">
                </div>

                <div class="mb-3">
                    <label for="clave" class="form-label">Contraseña</label>
                    <input type="password" placeholder="Ingrese su contraseña" class="form-control" id="clave"
                        name="clave" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-login w-100">
                    Entrar
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
